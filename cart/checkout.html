<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout Page</title>

    <link rel="stylesheet" href="checkstyles.css">
    <link rel="icon" type="image/x-icon" href="iconfinal.ico">

    <script src="checkscript.js" defer></script>
</head>

<body>

    <nav>
        <img class="headertext" src="logo_home.png" width="55" alt="Music World logo">
        <label class="headertext">Music World</label>
        <input id="search" type="text" placeholder="Search Music World">
        <button class="account" id="vis" type="button">Sign Up</button>
        <button class="account" type="button">Login</button>
    </nav>

<nav id="pages">
    <ul>
        <li><a href="../home.html">Home</a></li>
        <li><a href="../about-us/aboutus2.html">About Us</a></li>
        <li><a href="../categories/Categories.html">Categories</a></li>
        <li><a href="../contactus.html">Contact Us</a></li>
        <li><a href="cart.html">Cart</a></li>
    </ul>
</nav>


    <main>
        <h1>Checkout</h1>

        <div class="checkout-container">

            <section class="checkout-form">
                <h2>Billing Details</h2>

                <form id="checkout-form">

                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        autocomplete="street-address"
                        required
                    >

                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        autocomplete="address-level2"
                        required
                    >

                    <label for="payment">Payment Method</label>
                    <select id="payment" name="payment" required>
                        <option value="">Select payment method</option>
                        <option value="card">Credit/Debit Card</option>
                        <option value="gcash">GCash</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>

                    <button type="submit" class="place-order">
                        <b>Place Order</b>
                    </button>

                </form>
            </section>

            <section class="order-summary">
                <h2>Order Summary</h2>

                <div id="selected-items" aria-live="polite">
                    <p>Loading cart items...</p>
                </div>

                <hr>

                <div class="summary-item">
                    <span>Subtotal</span>
                    <span id="subtotal">₱0.00</span>
                </div>

                <div class="summary-item" id="discount-row" hidden>
                    <span>Coupon Discount (20%)</span>
                    <span id="discount-amount">−₱0.00</span>
                </div>

                <div class="summary-item">
                    <span>Shipping Fee</span>
                    <span id="shipping">₱0.00</span>
                </div>

                <div class="summary-item total">
                    <span>Total</span>
                    <span id="total">₱0.00</span>
                </div>

                <button
                    type="button"
                    class="back-to-cart"
                    onclick="window.location.href='cart.html'"
                >
                    Back to Cart
                </button>
            </section>

        </div>
    </main>

</body>
</html>
